# ============================================
# DOCKER COMPOSE — TaskFlow
#
# Defines 3 services:
#   postgres  — database
#   api       — Laravel backend
#   frontend  — React app with nginx
#
# They all share the same network so they
# can talk to each other by service name.
# ============================================
services:

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      # Named volume — data persists even when container stops
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel API
  api:
    build:
      context: ./taskflow-api
      dockerfile: Dockerfile
    container_name: taskflow-api
    environment:
      APP_ENV: production
      APP_KEY: base64:K7zGGqaSpxEnirxOXC9H1oSZlWGf1sMFESOQdF/3O3U=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: postgres        # ← service name, not localhost!
      DB_PORT: 5432
      DB_DATABASE: taskflow
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost:80
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./taskflow-api/storage:/var/www/html/storage

  # React Frontend
  frontend:
    build:
      context: ./taskflow
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "80:80"
    depends_on:
      - api

# Named volumes persist data between container restarts
volumes:
  postgres_data: