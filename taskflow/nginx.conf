server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # connect-src/img-src are pinned to the production API host
        # (Railway) rather than a bare https: wildcard. avatar_url comes
        # back from Laravel as an absolute URL built from asset()/APP_URL,
        # so img-src needs that exact host too, not just connect-src. blob:
        # covers the local avatar preview (URL.createObjectURL) shown before
        # upload. Left off the /api location below so these don't collide
        # with the headers Laravel already sets.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://taskflow-react-laravel-production.up.railway.app; font-src 'self' data:; connect-src 'self' https://taskflow-react-laravel-production.up.railway.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}